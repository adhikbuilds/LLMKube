{{- /* Namespace-scoped install (#1600): one Role and RoleBinding per watched
namespace carrying the manager's namespaced rules, which clusterrole.yaml then
leaves out. Nothing renders when controllerManager.watchNamespaces is empty.
The namespaces must already exist; the chart does not create them. */ -}}
{{- if .Values.rbac.create }}
{{- range $namespace := include "llmkube.watchNamespaces" . | fromJsonArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "llmkube.fullname" $ }}-manager-role
  namespace: {{ $namespace }}
  labels:
    {{- include "llmkube.labels" $ | nindent 4 }}
rules:
{{ include "llmkube.manager.namespacedRules" $ }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "llmkube.fullname" $ }}-manager-rolebinding
  namespace: {{ $namespace }}
  labels:
    {{- include "llmkube.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "llmkube.fullname" $ }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "llmkube.serviceAccountName" $ }}
  namespace: {{ include "llmkube.namespace" $ }}
{{- end }}
{{- end }}

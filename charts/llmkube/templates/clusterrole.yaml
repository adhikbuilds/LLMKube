{{- if .Values.rbac.create }}
{{- $watchNamespaces := include "llmkube.watchNamespaces" . | fromJsonArray }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llmkube.fullname" . }}-manager-role
  labels:
    {{- include "llmkube.labels" . | nindent 4 }}
{{- /* The rules live in _manager-rules.tpl. With watchNamespaces set, only the
cluster-scoped ones stay here and the rest move to a Role in each watched
namespace (manager-namespaced-rbac.yaml). */}}
rules:
{{ include "llmkube.manager.clusterRules" . }}
{{- if not $watchNamespaces }}
{{ include "llmkube.manager.namespacedRules" . }}
{{- end }}
{{- end }}
